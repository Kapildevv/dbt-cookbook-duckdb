# Copy this file to profiles.yml, which git ignores.
#
# One profile, one output per environment. Nothing in here is a secret on
# DuckDB; on a real warehouse every credential is an env_var and profiles.yml
# is never committed at all.
ecom:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ecom.duckdb
      schema: main
      threads: 4
    ci:
      type: duckdb
      path: ci.duckdb
      schema: main
      threads: 8
